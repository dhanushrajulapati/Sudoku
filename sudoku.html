<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="sudoku.css" />
  <script defer src="sudoku.js"></script>
</head>
<body>
  <!-- Background Grid -->
  <div class="bg-grid"></div>

  <!-- Sudoku Game Layout -->
  <div class="main-wrapper">
    <div class="container">
      <h1 class="title">Sudoku</h1>
      <div class="error-box">Errors: <span id="errors">0</span></div>
      <div id="board" class="board"></div>
      <div id="digits" class="digits"></div>
      <button class="new-game" onclick="newGame()">New Game</button>

      <div class="difficulty-select">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty" onchange="newGame()">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>
  </div>
</body>
</html>
