<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="sudoku.css" />
  <script defer src="sudoku.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Grid radial mask background */
    .bg-grid {
      position: absolute;
      inset: 0;
      z-index: -10;
      background:
        linear-gradient(to right, #4f4f4f2e 1px, transparent 1px),
        linear-gradient(to bottom, #4f4f4f2e 1px, transparent 1px);
      background-size: 14px 24px;
      mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, #000 70%, transparent 110%);
      -webkit-mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, #000 70%, transparent 110%);
    }

    .main-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background-color: #fff;
      position: relative;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
      width: 100%;
      z-index: 10;
    }

    .title {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #333;
    }

    .error-box {
      font-weight: bold;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 2px;
      margin: 1rem auto;
      justify-content: center;
    }

    .tile {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0;
      font-size: 1.2rem;
      cursor: pointer;
      border: 1px solid #ccc;
    }

    .tile-start {
      font-weight: bold;
      color: #333;
      background-color: #dcdcdc;
    }

    .horizontal-line {
      border-bottom: 2px solid black;
    }

    .vertical-line {
      border-right: 2px solid black;
    }

    .digits {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .number {
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      border: 1px solid #ccc;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .number:hover {
      background: #d4e7ff;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      transform: scale(1.1);
    }

    .number-selected {
      background: #87ceeb;
      border: 2px solid #333;
      color: #fff;
    }

    .new-game {
      margin-top: 1.2rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .new-game:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <!-- Background with grid + radial mask -->
  <div class="bg-grid"></div>

  <!-- Centered Game Layout -->
  <div class="main-wrapper">
    <div class="container">
      <h1 class="title">Sudoku</h1>
      <div class="error-box">Errors: <span id="errors">0</span></div>

      <div id="board" class="board"></div>

      <div id="digits" class="digits"></div>

      <button class="new-game" onclick="newGame()">New Game</button>
    </div>
  </div>
</body>
</html>
